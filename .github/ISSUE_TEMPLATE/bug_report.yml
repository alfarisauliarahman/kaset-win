name: Bug Report
description: Report a bug or unexpected behavior in KasetWin
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us investigate.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KasetWin Version
      description: Which version are you running? (see the About / Settings page)
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows Version
      description: Which Windows build are you on? (winver)
      placeholder: "e.g. Windows 11 23H2 (22631)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install Type
      options:
        - Installer (Kaset-win-Setup.exe)
        - Portable (Kaset-win-Portable.zip)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If possible, attach the log from `%LOCALAPPDATA%\Kaset\logs\` (or `%LOCALAPPDATA%\Kaset\diag.log`).
        Please redact any cookies, tokens, or account identifiers first.
      render: shell
    validations:
      required: false
